<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foodie's Restaurant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">🍴 Foodie's</a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Menu</a></li>
                <li class="nav-item"><a class="nav-link" href="#">About</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
            </ul>
        </div>
    </div>
</nav>

<!-- Carousel -->
<div id="slider" class="carousel slide" data-bs-ride="carousel">

    <div class="carousel-inner">

        <div class="carousel-item active">
            <img src="https://picsum.photos/1200/500?food1" class="d-block w-100">
        </div>

        <div class="carousel-item">
            <img src="https://picsum.photos/1200/500?food2" class="d-block w-100">
        </div>

        <div class="carousel-item">
            <img src="https://picsum.photos/1200/500?food3" class="d-block w-100">
        </div>

    </div>

</div>

<!-- Menu -->
<section class="container py-5">

<h2 class="text-center mb-4">Popular Dishes</h2>

<div class="row g-4">

<div class="col-md-4">

<div class="card shadow">

<img src="https://picsum.photos/300/200?pizza" class="card-img-top">

<div class="card-body">

<h5>Pizza</h5>

<p>Cheesy Italian Pizza.</p>

<button class="btn btn-danger">Order</button>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card shadow">

<img src="https://picsum.photos/300/200?burger" class="card-img-top">

<div class="card-body">

<h5>Burger</h5>

<p>Juicy Beef Burger.</p>

<button class="btn btn-warning">Order</button>

</div>

</div>

</div>

<div class="col-md-4">

<div class="card shadow">

<img src="https://picsum.photos/300/200?pasta" class="card-img-top">

<div class="card-body">

<h5>Pasta</h5>

<p>Creamy White Sauce Pasta.</p>

<button class="btn btn-success">Order</button>

</div>

</div>

</div>

</div>

</section>

<!-- Contact -->
<section class="container py-5">

<h2 class="text-center mb-4">Book a Table</h2>

<form>

<div class="row">

<div class="col-md-6 mb-3">
<input type="text" class="form-control" placeholder="Name">
</div>

<div class="col-md-6 mb-3">
<input type="email" class="form-control" placeholder="Email">
</div>

<div class="col-12 mb-3">
<textarea class="form-control" rows="4" placeholder="Message"></textarea>
</div>

<div class="text-center">
<button class="btn btn-primary">Submit</button>
</div>

</div>

</form>

</section>

<!-- Footer -->
<footer class="bg-dark text-white text-center p-3">
© 2026 Foodie's Restaurant
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
